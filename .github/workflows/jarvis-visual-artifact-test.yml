name: JARVIS Visual Artifact Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upload-artifact:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify source PNG
        shell: bash
        run: |
          set -euo pipefail

          readonly source_path='jarvis-review-test/V06/layer_03.png'
          readonly expected_sha='04a37c428a1ff4f4d88f20d9ce08881534d8874b689d602af9afdc4e1cd9bc45'

          if [[ ! -f "$source_path" ]]; then
            echo "::error file=$source_path::Required source PNG does not exist"
            exit 1
          fi

          actual_sha="$(sha256sum "$source_path" | awk '{print $1}')"
          echo "Source SHA-256: $actual_sha"

          if [[ "$actual_sha" != "$expected_sha" ]]; then
            echo "::error file=$source_path::SHA-256 mismatch: expected $expected_sha, received $actual_sha"
            exit 1
          fi

      - name: Upload exact source PNG
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-v06-layer03
          path: jarvis-review-test/V06/layer_03.png
          if-no-files-found: error
          compression-level: 0
