name: JARVIS Visual Candidate

run-name: JARVIS candidate ${{ github.sha }}

on:
  push:
    branches: [main]
    paths:
      - "projects/*/control/review-candidates/**/active.json"
  workflow_dispatch:
    inputs:
      candidate_manifest:
        description: Repository-relative path to one active candidate manifest
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish-candidate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Resolve and verify content-addressed candidate
        id: candidate
        shell: bash
        env:
          DISPATCH_MANIFEST: ${{ inputs.candidate_manifest }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            manifest_path="$DISPATCH_MANIFEST"
          else
            mapfile -t manifests < <(
              git diff --name-only "$BEFORE_SHA" "$HEAD_SHA" -- \
                'projects/*/control/review-candidates/**/active.json'
            )
            if [[ "${#manifests[@]}" -ne 1 ]]; then
              echo "::error::Expected exactly one changed active candidate manifest, found ${#manifests[@]}"
              exit 1
            fi
            manifest_path="${manifests[0]}"
          fi

          if [[ ! "$manifest_path" =~ ^projects/[a-z0-9-]+/control/review-candidates/[a-z0-9-]+/V[0-9]{2}/[0-9]{2}/active\.json$ ]]; then
            echo "::error::Unsafe or non-canonical candidate manifest path: $manifest_path"
            exit 1
          fi
          if [[ ! -f "$manifest_path" ]]; then
            echo "::error file=$manifest_path::Candidate manifest does not exist"
            exit 1
          fi

          protocol="$(jq -er '.protocol_version' "$manifest_path")"
          state="$(jq -er '.state' "$manifest_path")"
          expected_sha="$(jq -er '.candidate_sha256' "$manifest_path")"
          candidate_path="$(jq -er '.candidate_path' "$manifest_path")"
          artifact_name="$(jq -er '.artifact_name' "$manifest_path")"

          [[ "$protocol" == "jarvis-return-path-v1" ]] || {
            echo "::error file=$manifest_path::Unsupported protocol: $protocol"; exit 1;
          }
          [[ "$state" == "READY_FOR_JARVIS_REVIEW" ]] || {
            echo "::error file=$manifest_path::Candidate is not ready for JARVIS review"; exit 1;
          }
          [[ "$expected_sha" =~ ^[a-f0-9]{64}$ ]] || {
            echo "::error file=$manifest_path::Invalid candidate SHA-256"; exit 1;
          }
          [[ "$artifact_name" =~ ^[A-Za-z0-9._-]+$ ]] || {
            echo "::error file=$manifest_path::Unsafe artifact name"; exit 1;
          }

          manifest_dir="$(dirname "$manifest_path")"
          [[ "$candidate_path" == "$manifest_dir/candidates/$expected_sha.png" ]] || {
            echo "::error file=$manifest_path::Candidate path is not content-addressed beneath its manifest"; exit 1;
          }
          git ls-files --error-unmatch "$candidate_path" >/dev/null
          actual_sha="$(sha256sum "$candidate_path" | awk '{print $1}')"
          [[ "$actual_sha" == "$expected_sha" ]] || {
            echo "::error file=$candidate_path::SHA-256 mismatch: expected $expected_sha, received $actual_sha"; exit 1;
          }

          artifact_dir="$RUNNER_TEMP/jarvis-candidate"
          mkdir -p "$artifact_dir"
          cp "$candidate_path" "$artifact_dir/candidate.png"
          cp "$manifest_path" "$artifact_dir/candidate-manifest.json"
          jq -n \
            --arg protocol "$protocol" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg commit_sha "$GITHUB_SHA" \
            --arg workflow_run_id "$GITHUB_RUN_ID" \
            --arg source_path "$candidate_path" \
            --arg candidate_sha256 "$actual_sha" \
            '{protocol_version:$protocol,repository:$repository,commit_sha:$commit_sha,workflow_run_id:$workflow_run_id,source_path:$source_path,candidate_sha256:$candidate_sha256}' \
            > "$artifact_dir/artifact-provenance.json"

          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
          echo "artifact_dir=$artifact_dir" >> "$GITHUB_OUTPUT"
          echo "candidate_sha256=$actual_sha" >> "$GITHUB_OUTPUT"
          echo "### JARVIS candidate" >> "$GITHUB_STEP_SUMMARY"
          echo "Candidate SHA-256: \`$actual_sha\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Manifest: \`$manifest_path\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload exact candidate and provenance
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.candidate.outputs.artifact_name }}
          path: ${{ steps.candidate.outputs.artifact_dir }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Record artifact identifier
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          CANDIDATE_SHA: ${{ steps.candidate.outputs.candidate_sha256 }}
        run: |
          echo "Artifact ID: \`$ARTIFACT_ID\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Verified candidate SHA-256: \`$CANDIDATE_SHA\`" >> "$GITHUB_STEP_SUMMARY"
